<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darius Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --raised:#F4F7FB; --line:#D5DDE8; --line-soft:#E4EAF2;
  --text:#152031; --muted:#5B6B82; --faint:#8794A8;
  --blue:#2F6FEB; --ice:#0E8BD6; --amber:#C27A00; --coral:#D64545; --mint:#1F9D74;
  --grid:rgba(21,32,49,.05); --weekend:rgba(21,32,49,.035);
  --glow:rgba(47,111,235,.18);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161F; --surface:#17202C; --raised:#1E2937; --line:#2A384A; --line-soft:#223042;
    --text:#E4EAF3; --muted:#8C9BB0; --faint:#647389;
    --blue:#5B9BFF; --ice:#7CC8FF; --amber:#FFB547; --coral:#FF6B6B; --mint:#3DD6A3;
    --grid:rgba(140,155,176,.07); --weekend:rgba(140,155,176,.045);
    --glow:rgba(91,155,255,.22);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161F; --surface:#17202C; --raised:#1E2937; --line:#2A384A; --line-soft:#223042;
  --text:#E4EAF3; --muted:#8C9BB0; --faint:#647389;
  --blue:#5B9BFF; --ice:#7CC8FF; --amber:#FFB547; --coral:#FF6B6B; --mint:#3DD6A3;
  --grid:rgba(140,155,176,.07); --weekend:rgba(140,155,176,.045);
  --glow:rgba(91,155,255,.22);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.muted{color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:12px 24px}
.brand{font-stretch:125%;font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--blue)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{background:var(--raised);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.spacer{flex:1}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.sync.dirty .dot{background:var(--amber)}
.sync.err .dot{background:var(--coral)}
.token-banner{padding:10px 18px;background:color-mix(in srgb,var(--coral) 16%,var(--bg));color:var(--text);border-bottom:1px solid color-mix(in srgb,var(--coral) 45%,var(--line));font-size:14px;line-height:1.45}
.token-banner[hidden]{display:none}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--coral)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}

main{padding:24px;max-width:1440px;margin:0 auto}
.view[hidden]{display:none}

/* Today */
.today-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.hero{position:relative;overflow:hidden;border-radius:16px;padding:28px 30px 26px;background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,
  var(--surface);
  border:1px solid var(--line);box-shadow:0 0 0 1px var(--glow),0 18px 50px -24px var(--glow)}
.hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.hero-kicker{font-size:13px;color:var(--ice);font-weight:600}
.hero h1{font-stretch:118%;font-weight:800;font-size:clamp(26px,3.4vw,40px);line-height:1.08;letter-spacing:-.02em;margin:10px 0 14px;max-width:22ch}
.hero.is-done h1{color:var(--muted);text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--mint)}
.hero-done{color:var(--muted);max-width:60ch;margin:0 0 20px}
.hero-done b{color:var(--text);font-weight:600}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){
  .hero h1{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px);letter-spacing:.02em}to{opacity:1;transform:none}}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 8px}
.panel h2{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:baseline;gap:8px}
.panel h2 small{font-weight:500;color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:20px}

.deadline{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line-soft)}
.deadline:first-of-type{border-top:0;padding-top:2px}
.days{font-stretch:118%;font-weight:800;font-size:30px;line-height:1;text-align:right}
.days small{display:block;font-size:11px;font-weight:600;color:var(--muted);font-stretch:100%;margin-top:4px}
.days.soon{color:var(--amber)}
.days.late{color:var(--coral)}
.dl-title{font-weight:700}
.dl-date{font-size:13px;color:var(--muted)}
.dl-hold{font-size:13px;margin-top:6px;padding:6px 8px;border-radius:6px;background:var(--raised);border-left:3px solid var(--amber)}
.dl-hold b{font-weight:600}
.meter{height:5px;border-radius:3px;background:var(--line-soft);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:3px}

.task-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line-soft)}
.task-row:first-of-type{border-top:0}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--faint);background:none;cursor:pointer;margin-top:1px;display:grid;place-items:center;padding:0}
.check:hover{border-color:var(--mint)}
.check.on{background:var(--mint);border-color:var(--mint)}
.check.on::after{content:"";width:6px;height:10px;border:solid #0b1a14;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.t-title{font-weight:600;cursor:pointer}
.t-title:hover{color:var(--ice)}
.t-meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.whos{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}
.who{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 7px 1px 5px;border-radius:20px;background:var(--raised);border:1px solid var(--line);color:var(--text);line-height:1.4}
.who i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.who small{font-weight:500;color:var(--muted);font-size:10px}
.tools{display:inline-flex;gap:4px;flex-wrap:wrap}
.toolchip{display:inline-flex;font-size:11px;font-weight:600;padding:1px 6px;border-radius:20px;border:1px solid var(--line);color:var(--ice);white-space:nowrap}
.status-detail{display:block;font-size:12px;font-weight:500;color:var(--text);margin-top:4px;max-width:42ch;white-space:normal;line-height:1.4}
.status-detail b{font-weight:700}
.bb{margin-top:22px}
.bb h2{font-stretch:118%;font-weight:800;font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.bb-note{color:var(--muted);font-size:13px;margin:0 0 12px}
.bb-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bb-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.bb-card h3{margin:0 0 6px;font-size:16px}
.bb-card p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.45}
.bb-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12px;color:var(--muted)}
.bb-meta b{color:var(--text);font-weight:600}
.age{font-weight:700;font-size:13px;padding:2px 8px;border-radius:20px;background:var(--raised);white-space:nowrap}
.age.warn{color:var(--amber)}
.age.bad{color:var(--coral)}
.empty{color:var(--muted);font-size:14px;padding:6px 0 14px}

/* Portfolio */
.pf-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.pf-head h1{font-stretch:118%;font-weight:800;font-size:28px;margin:0;letter-spacing:-.02em}
.pf-sum{display:flex;gap:18px;font-size:14px;color:var(--muted)}
.pf-sum b{color:var(--text);font-size:18px;font-stretch:115%;margin-right:4px}
.pf-list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pf-row{display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(200px,1fr) minmax(220px,1.2fr) auto;gap:22px;align-items:center;padding:16px 20px;border-top:1px solid var(--line-soft);position:relative}
.pf-row:first-child{border-top:0}
.pf-row::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--pc)}
.pf-name{font-weight:700;font-size:16px;cursor:pointer}
.pf-name:hover{color:var(--ice)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.active{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,transparent)}
.chip.stalled{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 45%,transparent)}
.chip.last20{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.chip.lock{color:var(--ice)}
.track{position:relative;height:10px;border-radius:6px;background:var(--line-soft)}
.track i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--pc)}
.track .mark80{position:absolute;top:-3px;bottom:-3px;left:80%;width:2px;background:var(--faint);opacity:.6}
.pf-pct{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.pf-pct b{color:var(--text)}
.pf-next{font-size:14px}
.pf-block{font-size:13px;color:var(--coral);margin-top:4px}
.pf-block::before{content:"Blocked by: ";color:var(--muted)}
.lots{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.lot ul{list-style:none;margin:0;padding:0}
.lot li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:14px}
.lot li:first-child{border-top:0}
.x{border:0;background:none;color:var(--faint);cursor:pointer;padding:0 4px}
.x:hover{color:var(--coral)}
.add-row{display:flex;gap:8px;padding:10px 0 12px}
.add-row input{flex:1}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}

/* Timeline */
.tl-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.toggle input{accent-color:var(--blue);margin:0}
.toggle.crit:has(input:checked){color:var(--amber);border-color:color-mix(in srgb,var(--amber) 55%,transparent)}
.tl-bar select{width:auto;padding:6px 8px;font-size:13px}
.tl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tl-scroll{overflow:auto;max-height:calc(100vh - 210px);position:relative;overscroll-behavior:contain}
.tl-head{position:sticky;top:0;z-index:6;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.tl-corner{position:sticky;left:0;z-index:7;background:var(--surface);flex:0 0 var(--lw);border-right:1px solid var(--line);padding:8px 14px;font-size:12px;color:var(--muted);display:flex;align-items:end}
.tl-dates{position:relative;height:46px}
.mo{position:absolute;top:4px;font-size:12px;font-weight:700;padding-left:6px;border-left:1px solid var(--line);height:18px;white-space:nowrap}
.dy{position:absolute;top:24px;font-size:11px;color:var(--muted);text-align:center}
.dy.today{color:var(--blue);font-weight:800}
.tl-body{position:relative}
.tl-row{display:flex;height:var(--rh)}
.tl-label{position:sticky;left:0;z-index:4;flex:0 0 var(--lw);background:var(--surface);border-right:1px solid var(--line);padding:0 14px;display:flex;align-items:center;gap:8px;font-size:13px;overflow:hidden}
.tl-label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tl-label span:hover{color:var(--ice)}
.tl-label.done span{color:var(--faint);text-decoration:line-through}
.tl-row.group .tl-label{font-weight:700;font-size:13px;background:var(--raised)}
.tl-row.group{background:var(--raised)}
.tl-row.group .gdot{width:10px;height:10px;border-radius:3px}
.canvas{position:absolute;top:0;left:var(--lw);z-index:1}
.col-we{position:absolute;top:0;bottom:0;background:var(--weekend)}
.col-line{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--blue);opacity:.7;z-index:3}
.deps-svg{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible}
.deps-svg path{fill:none;stroke:var(--faint);stroke-width:1.4;opacity:.75}
.deps-svg path.crit{stroke:var(--amber);stroke-width:2;opacity:1}
.deps-svg path.bad{stroke:var(--coral);stroke-dasharray:4 3;opacity:1}
.bar{position:absolute;height:24px;border-radius:6px;z-index:3;cursor:grab;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px;font-weight:600;color:#fff;touch-action:none;user-select:none;background:var(--blue)}
.bar:active{cursor:grabbing}
.bar .bt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.bar .av{flex:0 0 18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;display:grid;place-items:center;color:#0d1520;background:var(--pcol,#fff)}
.bar.s-doing{background:color-mix(in srgb,var(--ice) 85%,#000 15%);color:#06131f}
.bar.s-waiting{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--faint) 70%,transparent) 0 6px,color-mix(in srgb,var(--faint) 45%,transparent) 6px 12px);color:var(--text)}
.bar.s-done{background:color-mix(in srgb,var(--mint) 35%,var(--surface));color:var(--muted)}
.bar.crit{box-shadow:0 0 0 2px var(--amber),0 0 18px -2px color-mix(in srgb,var(--amber) 70%,transparent)}
.bar.conflict{outline:2px dashed var(--coral);outline-offset:2px}
.bar .rz{position:absolute;right:-2px;top:0;bottom:0;width:10px;cursor:ew-resize}
.bar-out{position:absolute;font-size:12px;color:var(--muted);white-space:nowrap;z-index:3;pointer-events:none;line-height:24px}
.base{position:absolute;height:4px;border-radius:2px;background:var(--faint);opacity:.55;z-index:2}
.ms{position:absolute;width:16px;height:16px;transform:rotate(45deg);background:var(--text);border-radius:2px;z-index:3;cursor:grab;touch-action:none}
.ms.crit{background:var(--amber);box-shadow:0 0 14px color-mix(in srgb,var(--amber) 80%,transparent)}
.ms.done{background:var(--mint)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:18px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(5,10,18,.5);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:51;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:16px;flex:1}
.drawer .body{padding:18px 20px;overflow:auto;display:grid;gap:14px;flex:1}
.drawer footer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two[hidden]{display:none}
body.viewer #addTask,body.viewer #setBaseline,body.viewer #addProj,body.viewer [data-editproj],body.viewer .add-row,body.viewer .x,body.viewer #oneDone,body.viewer #oneEdit,body.viewer #saveBtn,body.viewer .rz{display:none!important}
body.viewer .check{pointer-events:none;opacity:.7}
body.viewer .bar,body.viewer .ms{cursor:pointer}
.deps-list{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--raised)}
.deps-list label{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0;color:var(--text);font-weight:500}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;z-index:51;padding:22px}
.modal h3{margin:0 0 6px}
.modal p{color:var(--muted);font-size:14px;margin:0 0 14px}
.modal .grid{display:grid;gap:12px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}


/* Detail sheets */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:51;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-30px 0 60px -30px rgba(0,0,0,.5)}
.sh-top{position:relative;padding:20px 26px 0;background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,var(--surface);border-bottom:1px solid var(--line)}
.sh-top::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc,var(--blue))}
.sh-crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sh-crumb button{border:0;background:none;padding:0;color:var(--ice);cursor:pointer;font-weight:600}
.sh-close{margin-left:auto}
.sh-title{font-stretch:115%;font-weight:800;font-size:clamp(22px,2.6vw,30px);line-height:1.12;letter-spacing:-.015em;margin:10px 0 10px;max-width:30ch}
.sh-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px}

.sheet-t td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.sheet-t tr:last-child td{border-bottom:0}
.sheet-t tbody tr{cursor:pointer}
.sheet-t tbody tr:hover td{background:var(--raised)}
.sheet-t td.num{color:var(--faint);width:34px}

.sheet-t tr.is-done td.nm{color:var(--muted);text-decoration:line-through}
.sheet-t tr.is-crit:not(.is-done) td.nm{color:var(--amber)}

.sheet-t .nowrap{white-space:nowrap}
.tbl-wrap{overflow-x:auto;border-radius:10px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:2px;background:var(--blue)}

.cl-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:15px}

.log::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.log-e{position:relative;padding:0 0 18px}
.log-e::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--blue)}
.log-e .lm{font-size:12px;color:var(--muted);font-weight:600}
.log-e p{margin:2px 0 0;max-width:66ch}
.links a{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ice);text-decoration:none;font-weight:600;margin-bottom:8px}
.links a:hover{border-color:var(--faint)}
.note-p{white-space:pre-wrap;font-size:15px;line-height:1.6;max-width:66ch;margin:0}
.t-desc{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;max-width:60ch}

.hp.ok{color:var(--mint);background:color-mix(in srgb,var(--mint) 12%,transparent)}

.hp.behind{color:var(--coral);background:color-mix(in srgb,var(--coral) 13%,transparent)}
.hp.blocked{color:var(--violet);background:color-mix(in srgb,var(--violet) 15%,transparent)}

/* ---------- dates ---------- */
const toD=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const fromD=t=>new Date(t).toISOString().slice(0,10);
const todayStr=()=>{const n=new Date();return fromD(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))};
const addDays=(s,n)=>fromD(toD(s)+n*DAY);
const diff=(a,b)=>Math.round((toD(b)-toD(a))/DAY);
const fmt=(s,o={month:'short',day:'numeric'})=>new Date(toD(s)).toLocaleDateString('en-US',{...o,timeZone:'UTC'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'-'+Math.random().toString(36).slice(2,7);

/* ---------- model helpers ---------- */
const T=id=>data.tasks.find(t=>t.id===id);
const P=id=>data.projects.find(p=>p.id===id);
const person=id=>data.people.find(p=>p.id===id)||{id,name:id||'Unassigned',color:'#94A3B8'};
const done=t=>t&&t.status==='done';
function ownersOf(t){
  if(!t) return [];
  if(Array.isArray(t)) return t.filter(Boolean);
  const ids=Array.isArray(t.owners)&&t.owners.length?t.owners:(t.owner?[t.owner]:[]);
  return ids.filter(Boolean);
}
const isShelved=t=>!!(t&&(t.shelved||t.status==='cancelled'));
const ownerNames=t=>ownersOf(t).map(id=>person(id).name).join(', ')||'Unassigned';
const depsOpen=t=>(t.deps||[]).map(T).filter(d=>d&&!done(d)&&!isShelved(d)&&!d.dateUnset);
const conflict=t=>(t.deps||[]).map(T).some(d=>d&&!done(d)&&!isShelved(d)&&!d.dateUnset&&toD(d.end)>toD(t.start)&&!(d.milestone&&d.end===t.start));
function projStats(pid){
  const ts=data.tasks.filter(t=>t.project===pid&&!t.milestone&&!isShelved(t));
  const w=t=>Math.max(+t.est||0,0.25);
  const total=ts.reduce((a,t)=>a+w(t),0), dn=ts.filter(done).reduce((a,t)=>a+w(t),0);
  const lastDone=ts.filter(t=>t.doneAt).map(t=>t.doneAt).sort().pop()||null;
  return {count:ts.length,doneCount:ts.filter(done).length,pct:total?dn/total:0,lastDone};
}
function chainFor(id,seen=new Set()){
  const t=T(id); if(!t||seen.has(id)) return []; seen.add(id);
  const preds=depsOpen(t).sort((a,b)=>toD(b.end)-toD(a.end));
  return [id,...(preds.length?chainFor(preds[0].id,seen):[])];
}
const milestones=()=>data.tasks.filter(t=>t.milestone&&!isShelved(t)).sort((a,b)=>toD(a.end)-toD(b.end));

/* ---------- v3: calendar, scheduling engine, health ---------- */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const PRI={1:'P1 Urgent',2:'P2 High',3:'P3 Normal',4:'P4 Low'};
const REASONS=['Waiting on someone','Waiting on a decision','Scope grew','Underestimated','Interrupted by other work','Restarted or redone','Missing tool or access','Days off','Other'];
const RCOL=['var(--violet)','var(--violet)','var(--amber)','var(--amber)','var(--coral)','var(--coral)','var(--ice)','var(--faint)','var(--muted)'];
let offSet=new Set();
function cal(){data.calendar=data.calendar||{workdays:[1,2,3,4,5],daysOff:[]};return data.calendar}
const isWork=s=>cal().workdays.includes(new Date(toD(s)).getUTCDay())&&!offSet.has(s);
function nextWork(s){let i=0;while(!isWork(s)&&i++<400)s=addDays(s,1);return s}
function addWork(s,n){s=nextWork(s);let k=1,i=0;while(k<n&&i++<3000){s=addDays(s,1);if(isWork(s))k++}return s}
function workDays(a,b){if(!a||!b||toD(b)<toD(a))return 0;let n=0;for(let t=toD(a);t<=toD(b);t+=DAY){if(isWork(fromD(t)))n++}return n}
const isAuto=t=>!t.milestone&&t.schedule!=='manual';
function schedule(){
  offSet=new Set((cal().daysOff||[]).map(d=>d.date));
  const st={},order=[];
  const visit=t=>{if(st[t.id])return;st[t.id]=1;(t.deps||[]).map(T).filter(Boolean).forEach(visit);order.push(t)};
  data.tasks.forEach(visit);
  order.forEach(t=>{
    if(isShelved(t)||t.dateUnset) return;
    if(!t.milestone&&!t.dur) t.dur=Math.max(1,workDays(t.start,t.end)||1);
    if(!isAuto(t)||done(t)) return;
    let s;
    if(t.status==='doing') s=t.start;
    else{
      const preds=(t.deps||[]).map(T).filter(p=>p&&!isShelved(p)&&!p.dateUnset);
      s=t.notBefore||(preds.length?null:t.start);
      preds.forEach(p=>{const c=addDays(p.end,1);if(!s||toD(c)>toD(s))s=c});
    }
    if(!s) return;
    t.start=nextWork(s); t.end=addWork(t.start,t.dur);
  });
}
function setStatus(t,s){
  if(t.status===s)return; t.statusHistory=t.statusHistory||[];
  if(!t.statusHistory.length) t.statusHistory.push({status:t.status,at:t.waitingSince||t.start});
  t.status=s; t.statusHistory.push({status:s,at:todayStr()});
  if(s==='done')t.doneAt=todayStr(); else delete t.doneAt;
  if(s==='waiting')t.waitingSince=t.waitingSince||todayStr(); else delete t.waitingSince;
}
function timeInStatus(t){
  const h=(t.statusHistory||[]).slice().sort((a,b)=>a.at.localeCompare(b.at)), out={todo:0,doing:0,waiting:0}, td=todayStr();
  if(!h.length){if(t.status==='waiting'&&t.waitingSince)out.waiting=diff(t.waitingSince,td);else if(t.status==='doing'&&toD(t.start)<=toD(td))out.doing=diff(t.start,td);return out}
  h.forEach((e,i)=>{const end=h[i+1]?h[i+1].at:(e.status==='done'?e.at:td);if(out[e.status]!==undefined)out[e.status]+=Math.max(0,diff(e.at,end))});
  return out;
}
function health(t){
  const td=todayStr();
  if(t.dateUnset) return {k:'ok',label:'Date not set',why:'No date yet.'};
  if(done(t)) return {k:'done',label:'Done',why:t.doneAt?`Finished ${fmt(t.doneAt)}`:'Finished'};
  if(t.milestone){
    const late=(t.deps||[]).map(T).filter(d=>d&&!done(d)&&toD(d.end)>toD(t.end)).sort((a,b)=>toD(b.end)-toD(a.end))[0];
    if(toD(t.end)<toD(td)) return {k:'behind',label:`${diff(t.end,td)}d late`,why:`Deadline was ${fmt(t.end)}`};
    if(late) return {k:'behind',label:'Will miss',why:`${late.title} finishes ${fmt(late.end)}, after this ${fmt(t.end)} deadline`,days:diff(t.end,late.end)};
    return {k:'ok',label:'On track',why:'Everything feeding it finishes in time'};
  }
  const open=depsOpen(t);
  if(t.status==='waiting'){const a=t.waitingSince?diff(t.waitingSince,td):0;return {k:'blocked',label:'Blocked',why:`Waiting on ${t.waitingOn||ownerNames(t)}${a?` for ${a} day${a===1?'':'s'}`:''}`}}
  if(open.length&&toD(t.start)<=toD(td)) return {k:'blocked',label:'Blocked',why:`Can't start until "${open[0].title}" (${ownerNames(open[0])}) is done`};
  if(toD(t.end)<toD(td)){const n=workDays(addDays(t.end,1),td);return {k:'behind',label:`${n||1}d late`,why:`Was due ${fmt(t.end)} and is still open`,days:n}}
  if(t.status==='todo'&&toD(t.start)<toD(td)&&!open.length) return {k:'risk',label:'Not started',why:`Should have started ${fmt(t.start)}`};
  if(t.status==='doing'){const d=t.dur||1,el=workDays(t.start,td<t.end?td:t.end),exp=Math.min(1,el/d),pct=taskPct(t)/100;
    if((t.checklist||[]).length&&exp-pct>.34) return {k:'risk',label:'Behind pace',why:`${Math.round(exp*100)}% of the time used, ${Math.round(pct*100)}% of the steps done`}}
  const bv=t.baselineEnd?workDays(addDays(t.baselineEnd,1),t.end):0;
  if(bv>0) return {k:'risk',label:`${bv}d slip`,why:`Now finishing ${fmt(t.end)}, ${bv} working day${bv===1?'':'s'} after the baseline (${fmt(t.baselineEnd)})`,days:bv};
  if(t.status==='todo'&&toD(t.start)>toD(td)) return {k:'ok',label:'On track',why:`Starts ${fmt(t.start)}`};
  return {k:'ok',label:'On track',why:'On schedule'};
}
const HRANK={behind:4,blocked:3,risk:2,ok:1,done:0,idle:0};
const hpHtml=(h,title=true)=>`<span class="hp ${h.k}" ${title?`title="${esc(h.why||'')}"`:''}>${esc(h.label)}</span>`;
const priHtml=t=>`<span class="pri p${t.priority||3}" title="${PRI[t.priority||3]}">P${t.priority||3}</span>`;
function worst(ts){const open=ts.filter(t=>!done(t));if(!ts.length)return {k:'idle',label:'No tasks'};if(!open.length)return {k:'done',label:'Done'};
  const hs=open.map(health).sort((a,b)=>HRANK[b.k]-HRANK[a.k]);const w=hs[0];const n=hs.filter(h=>h.k===w.k).length;
  const lbl={behind:'Behind',blocked:'Blocked',risk:'At risk',ok:'On track'}[w.k];return {k:w.k,label:lbl+(w.k!=='ok'&&n>1?` (${n})`:''),why:w.why}}
function projRows(pid){
  const p=P(pid)||{}, ts=data.tasks.filter(t=>t.project===pid&&(!isShelved(t)||t.dateUnset)), phs=p.phases||[];
  const so=a=>a.slice().sort((x,y)=>(x.dateUnset?1:0)-(y.dateUnset?1:0)||toD(x.start)-toD(y.start)||(x.milestone?1:0)-(y.milestone?1:0));
  const out=phs.map(ph=>({ph,tasks:so(ts.filter(t=>t.phase===ph.id))}));
  const rest=so(ts.filter(t=>!t.phase||!phs.some(ph=>ph.id===t.phase)));
  if(rest.length) out.push({ph:phs.length?{id:'',name:'Other'}:null,tasks:rest});
  return out;
}
function rollup(ts){
  if(!ts.length)return null;
  const w=t=>Math.max(+t.est||0,0.25), work=ts.filter(t=>!t.milestone);
  const dated=ts.filter(t=>!t.dateUnset);
  const start=dated.length?dated.map(t=>t.start).sort()[0]:null, end=dated.length?dated.map(t=>t.end).sort().pop():null;
  const tot=work.reduce((a,t)=>a+w(t),0), dn=work.reduce((a,t)=>a+w(t)*taskPct(t)/100,0);
  const left=work.reduce((a,t)=>a+(+t.est||0)*(1-taskPct(t)/100),0);
  return {start,end,dur:start&&end?workDays(start,end):0,pct:tot?Math.round(dn/tot*100):0,left:Math.round(left*10)/10,h:worst(ts)};
}
function moveTask(t,n){const ns=addDays(t.start,n);
  if(t.milestone){t.start=t.end=ns}else if(!isAuto(t)){t.start=ns;t.end=addDays(t.end,n)}else{t.notBefore=ns;t.start=ns}}
function resizeTask(t,ne){if(toD(ne)<toD(t.start))ne=t.start;if(!t.milestone){t.dur=Math.max(1,workDays(t.start,ne)||1);if(!isAuto(t))t.end=ne}}
function askSlip(t,oldEnd){
  schedule(); if(toD(t.end)<=toD(oldEnd)) return;
  const days=workDays(addDays(oldEnd,1),t.end)||diff(oldEnd,t.end);
  const l2=document.getElementById('layer2'); let pick='';
  l2.innerHTML=`<div class="scrim" style="z-index:55"></div><div class="modal" style="z-index:56" role="dialog" aria-modal="true"><h3>Why did this move?</h3>
    <p>"${esc(t.title)}" now finishes ${fmt(t.end)}, ${days} working day${days===1?'':'s'} later than ${fmt(oldEnd)}. Logging the reason is how the plan learns where time goes.</p>
    <div class="reason-grid">${REASONS.map(r=>`<button data-r="${esc(r)}" aria-pressed="false">${esc(r)}</button>`).join('')}</div>
    <label class="f">Details (optional)<input type="text" id="slipNote" placeholder="Doug was out until Monday"></label>
    <div class="actions"><button class="btn" id="slipSkip">Skip</button><button class="btn primary" id="slipSave" disabled>Log it</button></div></div>`;
  l2.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{pick=b.dataset.r;l2.querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-pressed',x===b));l2.querySelector('#slipSave').disabled=false});
  l2.querySelector('#slipSkip').onclick=()=>{l2.innerHTML=''};
  l2.querySelector('#slipSave').onclick=()=>{const note=l2.querySelector('#slipNote').value.trim();
    t.slips=t.slips||[];t.slips.push({date:todayStr(),days,reason:pick,note,by:'Darius'});
    t.log=t.log||[];t.log.push({date:todayStr(),by:'Darius',text:`Finish moved to ${fmt(t.end)} (+${days}d). ${pick}${note?': '+note:''}.`});
    l2.innerHTML='';touch();toast('Delay logged')};
}

const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const ghUrl=()=>`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${gh.path}`;
const ghHeaders=()=>({Authorization:'Bearer '+gh.token,Accept:'application/vnd.github+json'});
async function ghGet(){
  const r=await fetch(ghUrl()+'?ref='+encodeURIComponent(gh.branch),{headers:ghHeaders(),cache:'no-store'});
  if(!r.ok) throw new Error('GitHub said '+r.status+(r.status===404?' (file or repo not found)':r.status===401?' (token rejected)':''));
  const j=await r.json(); return {data:JSON.parse(b64d(j.content)),sha:j.sha};
}
async function apiFetch(path,opt={}){
  const u=path+(shareKey&&!path.includes('?')?`?key=${encodeURIComponent(shareKey)}`:'');
  return fetch(u,{cache:'no-store',credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});
}
async function loadApi(){
  try{const me=await apiFetch('/api/me');if(!me.ok)return false;const j=await me.json();role=j.role;shareUrl=j.shareUrl||'';}catch(e){return false}
  apiMode=true; source='server';
  if(!document.querySelector('link[rel=manifest]')){const l=document.createElement('link');l.rel='manifest';l.href='/manifest.webmanifest';document.head.appendChild(l)}
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
  if(!role){data=EMPTY();render();openLogin();return true}
  try{const r=await apiFetch('/api/plan');if(!r.ok)throw new Error('Server said '+r.status);const j=await r.json();data=j.data;version=j.version;syncErr=''}
  catch(e){syncErr='Offline';let local=null;try{local=JSON.parse(localStorage.getItem(LS_DATA)||'null')}catch(_){}data=(local&&local.data)||EMPTY()}
  data.parked=data.parked||[];data.ideas=data.ideas||[];data.backBurner=data.backBurner||[];
  let local=null;try{local=JSON.parse(localStorage.getItem(LS_DATA)||'null')}catch(_){}
  if(role==='owner'&&local&&local.dirty&&local.api&&local.data){data=local.data;version=local.version;dirty=true;queueSave()}
  render(); return true;
}
function queueSave(){if(!apiMode||viewer())return;clearTimeout(saveTimer);saveTimer=setTimeout(saveApi,1200)}
async function saveApi(force){
  if(saving){queueSave();return} saving=true; renderSync(); schedule();
  try{
    const r=await apiFetch('/api/plan',{method:'PUT',body:JSON.stringify({data,version:force?null:version})});
    if(r.status===409){const j=await r.json();saving=false;
      const c=await ask('The plan changed on the server','Someone else saved a newer version while you were editing. Keep yours and overwrite theirs, or load theirs and drop your last edits?',[['theirs','Load theirs'],['mine','Keep mine','primary']]);
      if(c==='mine'){version=j.version;return saveApi(true)} data=j.data;version=j.version;dirty=false;persistLocal();render();toast('Loaded the newer plan');return}
    if(r.status===401){saving=false;openLogin('Your session ended. Log in again to save.');return}
    if(!r.ok)throw new Error('Server said '+r.status);
    const j=await r.json();version=j.version;dirty=false;syncErr='';persistLocal();
  }catch(e){syncErr=navigator.onLine?'Save failed, retrying':'Offline, will save when back online';setTimeout(queueSave,8000)}
  saving=false; renderSync();
}
function openLogin(note){

async function readPublished(){
  const r=await fetch('projects.json',{cache:'no-store'});
  if(!r.ok) throw new Error('Published plan said '+r.status);
  return r.json();
}
const editsNewer=(local,remote)=>{
  if(!local||!local.dirty||!local.data) return false;
  const remoteTs=Date.parse((remote&&remote.meta&&(remote.meta.updated||remote.meta.lastUpdated))||'')||0;
  return (local.ts||0)>remoteTs;
};
const pagesHost=()=>location.protocol==='file:'||/(^|\.)github\.io$/.test(location.hostname);
async function load(){
  tokenRejected=false; showedPublished=false;
  if(!pagesHost()&&await loadApi()) return;
  let remote=null, fromFile=false;
  if(gh.token){
    try{const g=await ghGet();remote=g.data;sha=g.sha;source='github';syncErr=''}
    catch(e){
      tokenRejected=/401|403|token rejected/i.test(String(e&&e.message||e));
      syncErr=tokenRejected?'GitHub token rejected':(String(e&&e.message||'').includes('Failed to fetch')?'Could not reach GitHub':(e&&e.message)||'Could not reach GitHub');
      try{remote=await readPublished();fromFile=true;source='file';sha=null}
      catch(e2){remote=null}
    }
  }else{
    try{remote=await readPublished();fromFile=true;source='file';syncErr=''}
    catch(e){remote=null}
  }
  let local=null; try{local=JSON.parse(localStorage.getItem(LS_DATA)||'null')}catch(e){}
  if(remote&&editsNewer(local,remote)){data=local.data;dirty=true;if(!sha)sha=local.sha||null}
  else if(remote){data=remote;dirty=false;showedPublished=fromFile;if(fromFile&&local)persistLocal()}
  else if(local&&local.data){data=local.data;dirty=!!local.dirty;if(!sha)sha=local.sha||null;source='local'}
  else{data=structuredClone(SEED);source='seed'}
  data.parked=data.parked||[];data.ideas=data.ideas||[];data.backBurner=data.backBurner||[];
  render();
}
async function saveGitHub(){
  if(!gh.token){openSettings('Add a GitHub token to save. Until then your edits are kept in this browser.');return}
  setSync('Saving'); schedule();
  try{
    let current=null; try{current=await ghGet()}catch(e){if(!/404/.test(e.message))throw e}
    if(current&&sha&&current.sha!==sha){
      const choice=await ask('The plan changed on GitHub','Someone else saved a newer version since you loaded this page. Overwrite it with your version, or load theirs and drop your unsaved edits?',[['cancel','Cancel'],['theirs','Load theirs'],['mine','Overwrite with mine','primary']]);
      if(choice==='theirs'){data=current.data;sha=current.sha;dirty=false;persistLocal();render();toast('Loaded the newer plan from GitHub');return}
      if(choice!=='mine'){render();return}
    }
    const body={message:`Plan updated from dashboard by ${data.meta?.by||'Darius'}`,content:b64e(JSON.stringify(data,null,2)),branch:gh.branch};
    if(current) body.sha=current.sha;
    const r=await fetch(ghUrl(),{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error('GitHub said '+r.status);
    const j=await r.json(); sha=j.content.sha; dirty=false; source='github'; syncErr=''; persistLocal(); render(); toast('Saved to GitHub');
  }catch(e){
    syncErr=e.message.includes('Failed to fetch')?'Could not reach GitHub from this page':e.message;
    render(); toast(syncErr);
  }
}
function setSync(label){document.getElementById('syncLabel').textContent=label}
function renderSync(){
  const el=document.getElementById('sync'); el.className='sync'+(dirty?' dirty':'')+(syncErr?' err':'');
  const by=data.meta?.by, up=data.meta?.updated;
  if(apiMode){el.className='sync'+(dirty||saving?' dirty':'')+(syncErr?' err':'');setSync(syncErr||(viewer()?'View only':saving?'Saving':dirty?'Unsaved edits':'All changes saved'));document.getElementById('saveBtn').hidden=true;return}
  let label = dirty?'Unsaved edits': source==='github'?'Synced with GitHub': source==='file'?'Read from projects.json':'Local copy';
  if(syncErr&&!dirty) label=syncErr;
  if(viewer()) label='View only';
  if(!dirty&&by&&up) label+=` · ${by}, ${new Date(up).toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
  setSync(label.replace(' · ',', '));
  document.getElementById('saveBtn').hidden=!dirty;
}

function render(){

function statusDetailHtml(t){if(!t||!t.statusDetail)return '';const about=t.statusDetailAbout?`<b>${esc(t.statusDetailAbout)}. </b>`:'';return `<div class="status-detail">${about}${esc(t.statusDetail)}</div>`}

  const rows=[];

      projRows(p.id).forEach(g=>{const gt=g.tasks.filter(t=>ts.includes(t));if(!gt.length)return;if(g.ph){rows.push({ph:g.ph,phTasks:gt})}gt.forEach(t=>rows.push({t,ind:!!g.ph}))})});
  }else{
    data.people.forEach(p=>{const ts=tasks.filter(t=>ownersOf(t).includes(p.id)&&!t.milestone);if(!ts.length)return;

      rows.push({g:true,label:`${p.name}${hrs?`, ${hrs} h open`:''}`,color:p.color});sortT(ts).forEach(t=>rows.push({t}))});
  }

  const r0=fromD(min-3*DAY), n=Math.round((max-min)/DAY)+14, W=n*dw, H=rows.length*RH;

    const show=dw>=24||dow===1;
    if(show) dates+=`<div class="dy ${s===td?'today':''}" style="left:${i*dw}px;width:${dw>=24?dw:dw*7}px;${dw<24?'text-align:left':''}">${dw>=24?d.getUTCDate():fmt(s)}</div>`;

    if(!r.t)return; const t=r.t, y=i*RH, p=person(ownersOf(t)[0]), isC=crit.has(t.id), bad=conflict(t);
    if(ui.base&&t.baselineStart&&!t.milestone) bars+=`<div class="base" style="left:${x(t.baselineStart)+2}px;top:${y+RH-7}px;width:${(diff(t.baselineStart,t.baselineEnd||t.baselineStart)+1)*dw-4}px" title="Baseline ${fmt(t.baselineStart)} to ${fmt(t.baselineEnd)}"></div>`;
    if(t.milestone){
      bars+=`<div class="ms ${isC?'crit':''} ${done(t)?'done':''}" data-bar="${t.id}" style="left:${x(t.end)+dw/2-8}px;top:${y+RH/2-8}px" title="${esc(t.title)}, ${fmt(t.end)}" tabindex="0" role="button" aria-label="${esc(t.title)}"></div>`;

    }else{

      bars+=`<div class="bar s-${t.status} ${isC?'crit':''} ${bad?'conflict':''}" data-bar="${t.id}" style="left:${x(t.start)+2}px;top:${y+(RH-24)/2}px;width:${w}px;--pcol:${p.color}" tabindex="0" role="button" aria-label="${esc(t.title)}, ${esc(showRange(t))}" title="${esc(t.title)}\n${esc(ownerNames(t))}, ${esc(showRange(t))}${bad?'\nStarts before a dependency ends':''}">
        <span class="av">${esc(p.name[0])}</span>${inside?`<span class="bt">${esc(t.title)}</span>`:''}<span class="rz" data-rz="1"></span></div>`;

      paths+=`<path class="${cls}" d="M${x1} ${y1} C ${x1+c} ${y1}, ${x2-c} ${y2}, ${x2} ${y2}" marker-end="url(#ah${cls?'-'+cls:''})"/>`;
    });
  });
  const mk=(id,c)=>`<marker id="${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" style="fill:${c};stroke:none"/></marker>`;
  const labels=rows.map(r=>r.g
    ?`<div class="tl-row group"><div class="tl-label" ${r.pid?`data-pdetail="${r.pid}"`:''}><span class="gdot" style="background:${r.color}"></span>${esc(r.label)}</div></div>`

    :`<div class="tl-row"><div class="tl-label ${done(r.t)?'done':''} ${r.ind?'ind':''}"><span data-open="${r.t.id}" title="${esc(r.t.title)}">${r.t.milestone?'◆ ':''}${esc(r.t.title)}</span></div></div>`).join('');
  const sc=document.getElementById('tlScroll'), keepX=sc.scrollLeft, keepY=sc.scrollTop, first=!sc.dataset.ready;
  sc.style.setProperty('--lw',lw+'px'); sc.style.setProperty('--rh',RH+'px');
  sc.innerHTML=`<div class="tl-head" style="width:${lw+W}px"><div class="tl-corner">${ui.group==='project'?'Project and task':'Person and task'}</div><div class="tl-dates" style="width:${W}px">${dates}</div></div>
    <div class="tl-body" style="width:${lw+W}px;height:${H}px">${labels}
      <div class="canvas" id="canvas" style="width:${W}px;height:${H}px">${cols}

        <svg class="deps-svg" width="${W}" height="${H}"><defs>${mk('ah','var(--faint)')}${mk('ah-crit','var(--amber)')}${mk('ah-bad','var(--coral)')}</defs>${paths}</svg>
        ${bars}</div></div>`;
  if(first){sc.scrollLeft=Math.max(0,x(td)-dw*4);sc.dataset.ready=1}else{sc.scrollLeft=keepX;sc.scrollTop=keepY}
}

/* drag + resize */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-bar]'); if(!b||e.button>0)return;
  const t=T(b.dataset.bar); if(!t)return;
  drag={el:b,t,mode:e.target.dataset.rz&&!t.milestone?'rz':'mv',sx:e.clientX,left:parseFloat(b.style.left),width:parseFloat(b.style.width)||0,moved:false,dd:0};
  b.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{
  if(!drag)return; if(viewer())return; const dx=e.clientX-drag.sx; if(Math.abs(dx)>4)drag.moved=true; if(!drag.moved)return;
  const dw=tlGeom.dw; drag.dd=Math.round(dx/dw);
  if(drag.mode==='mv') drag.el.style.left=(drag.left+drag.dd*dw)+'px';
  else drag.el.style.width=Math.max(dw-4,drag.width+drag.dd*dw)+'px';
});
document.addEventListener('pointerup',()=>{
  if(!drag)return; const d=drag; drag=null;
  if(!d.moved){openDetail(d.t.id,'general');return}
  if(!d.dd){render();return}
  const oldEnd=d.t.end;
  if(d.mode==='mv') moveTask(d.t,d.dd); else resizeTask(d.t,addDays(d.t.end,d.dd));
  touch(); toast(`${d.t.title}: ${fmt(d.t.start)}${d.t.start!==d.t.end?' to '+fmt(d.t.end):''}`); askSlip(d.t,oldEnd);
});
document.addEventListener('keydown',e=>{
  const b=e.target.closest&&e.target.closest('[data-bar]');
  if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDetail(b.dataset.bar,'general')}
  if(b&&!viewer()&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const t=T(b.dataset.bar),n=e.key==='ArrowLeft'?-1:1;
    if(e.shiftKey&&!t.milestone){resizeTask(t,addDays(t.end,n))}else{moveTask(t,n)}
    touch();requestAnimationFrame(()=>document.querySelector(`[data-bar="${t.id}"]`)?.focus())}
  if(e.key==='Escape'){if(document.getElementById('layer2').innerHTML)document.getElementById('layer2').innerHTML='';else closeLayer()}

function feedsMs(id){const out=new Map(),seen=new Set();const walk=i=>successors(i).forEach(s=>{if(seen.has(s.id))return;seen.add(s.id);if(s.milestone)out.set(s.id,s);walk(s.id)});walk(id);return [...out.values()].sort((a,b)=>toD(a.end)-toD(b.end))}
const critOf=id=>milestones().filter(m=>!done(m)&&m.id!==id&&chainFor(m.id).includes(id));

const taskRef=t=>`${t.milestone?'◆ ':''}${esc(t.title)}<small class="tid">${esc(t.id)}</small>`;
function taskPct(t){if(done(t))return 100;const c=t.checklist||[];if(c.length)return Math.round(c.filter(x=>x.done).length/c.length*100);return +t.pct||0}
const stHtml=t=>`<span class="st ${t.status}"><i></i>${STATUS[t.status]}</span>`;
const durTxt=t=>t.dateUnset?'Date not set':t.milestone?'Milestone':(()=>{const w=t.dur||workDays(t.start,t.end)||1;return `${w} working day${w===1?'':'s'}`})();
const fmtLong=s=>fmt(s,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
let sheetTab='general';
function timingLine(t){
  if(t.dateUnset) return 'Date not set';
  const td=todayStr(); if(done(t)) return `Finished${t.doneAt?' '+fmt(t.doneAt):''}`;
  const toStart=diff(td,t.start), toEnd=diff(td,t.end);
  if(toEnd<0) return `<span class="pos">${-toEnd} day${toEnd===-1?'':'s'} overdue</span>`;
  if(t.milestone) return toEnd===0?'Due today':`Due in ${toEnd} day${toEnd===1?'':'s'}`;
  if(toStart>0) return `Starts in ${toStart} day${toStart===1?'':'s'}`;
  return toEnd===0?'Due today':`${toEnd} day${toEnd===1?'':'s'} left`;
}
function depTable(list,mode,t){
  if(!list.length) return `<p class="prose empty-p">${mode==='pred'?'Nothing has to finish first. This can start any time.':'Nothing waits on this directly.'}</p>`;
  return `<div class="tbl-wrap"><table class="sheet-t"><thead><tr><th>Task</th><th>Owner</th><th>${mode==='pred'?'Finish':'Start'}</th><th>Status</th><th>Gap</th></tr></thead><tbody>${list.map(x=>{
    const gap=mode==='pred'?diff(x.end,t.start):diff(t.end,x.start);
    const g=x.milestone&&mode==='pred'?diff(x.end,t.start)+1:gap;
    const gapTxt=done(mode==='pred'?x:t)&&mode==='pred'?'<span class="muted">Done</span>':g<0?`<span class="pos">Overlaps ${-g}d</span>`:g<=1?'<span class="muted">Back to back</span>':`${g-1}d slack`;
    return `<tr data-detail="${x.id}"><td class="nm">${taskRef(x)}</td><td class="nowrap">${ownersHtml(x)}</td><td class="nowrap">${x.dateUnset||x.openEnded?showEnd(x):fmt(mode==='pred'?x.end:x.start)}</td><td>${stHtml(x)}</td><td class="nowrap">${gapTxt}</td></tr>`}).join('')}</tbody></table></div>`;
}

        <div class="deps-list">${cand.map(x=>`<label><input type="checkbox" value="${x.id}" ${(t.deps||[]).includes(x.id)?'checked':''}>${x.milestone?'◆ ':''}${esc(x.title)}</label>`).join('')||'<span class="muted">No other tasks in this project yet</span>'}</div></div>

      <label class="f">Notes<textarea id="fNote">${esc(t.note||'')}</textarea></label>
    </div>
    <footer><button class="btn danger" id="fDel">Delete</button><div class="spacer"></div><button class="btn primary" id="fBack">Done</button></footer>
  </aside>`;
  const $=s=>layer.querySelector(s); const v=s=>$(s)?$(s).value:undefined;
  const apply=()=>{

  $('#fBack').onclick=()=>openDetail(t.id);

}

document.getElementById('settingsBtn').onclick=()=>openSettings();
document.getElementById('groupSeg').onclick=e=>{const b=e.target.closest('button');if(b){ui.group=b.dataset.g;saveUI();render()}};
document.getElementById('zoomSeg').onclick=e=>{const b=e.target.closest('button');if(b){ui.zoom=+b.dataset.z;saveUI();document.getElementById('tlScroll').dataset.ready='';render()}};
document.getElementById('projFilter').onchange=e=>{ui.proj=e.target.value;saveUI();render()};
document.getElementById('critTarget').onchange=e=>{ui.critTarget=e.target.value;saveUI();render()};
document.getElementById('tCrit').onchange=e=>{ui.crit=e.target.checked;saveUI();render()};
document.getElementById('tDeps').onchange=e=>{ui.deps=e.target.checked;saveUI();render()};
document.getElementById('tBase').onchange=e=>{ui.base=e.target.checked;saveUI();render()};
document.getElementById('setBaseline').onclick=async()=>{const a=await ask('Set the baseline?','This saves every task\'s current dates as the plan. Later slips get measured against it.',[['no','Cancel'],['yes','Set baseline','primary']]);
  if(a==='yes'){data.tasks.forEach(t=>{t.baselineStart=t.start;t.baselineEnd=t.end});ui.base=true;saveUI();touch();toast('Baseline set')}};
document.getElementById('addTask').onclick=()=>{const proj=ui.proj!=='all'?ui.proj:data.projects[0].id;const s=todayStr();
  const t={id:uid(proj),project:proj,title:'New task',owner:'darius',status:'todo',priority:3,start:s,end:addDays(s,1),dur:2,notBefore:s,est:1,deps:[]};data.tasks.push(t);touch();openTask(t.id,true)};
window.addEventListener('resize',()=>{if(ui.view==='timeline')render()});
window.addEventListener('online',()=>{if(apiMode&&dirty)queueSave()});
window.addEventListener('beforeunload',e=>{if(dirty&&(gh.token||apiMode)){e.preventDefault();e.returnValue=''}});
setTheme(localStorage.getItem('dp.theme')||'dark');
load();
</script>
</body>
</html>
